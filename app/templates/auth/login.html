{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">Iniciar sesión</h3>
                
                <!-- Mensajes de alerta (Éxito / Error) -->
                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for category, message in messages %}
                      <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <form action="{{ url_for('auth.login') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Usuario</label>
                        <input type="text" name="usuario" class="form-control" placeholder="nombre de usuario" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="contrasena" class="form-control" placeholder="********" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-3">INGRESAR</button>
                </form>
                <div class="text-center">
                    <!-- redirige la ruta de registro -->
                    <small>¿No tiene cuenta? <a href="{{url_for('auth.registro')}}">Registrarse aqui</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
