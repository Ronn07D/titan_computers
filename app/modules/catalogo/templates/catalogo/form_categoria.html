{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">{{'Editar Categoría' if categoria else 'Nueva Categoría'}}</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label>Nombre de la Categoría</label>
                        <input type="text" name="nombre" class="form-control" value="{{categoria.nombre if categoria else ''}}" required>
                    </div>
                    <div class="mb-3">
                        <label>Descripción</label>
                        <textarea name="descripcion" class="form-control" rows="3">{{ categoria.descripcion if categoria else ''}}</textarea>
                    </div>
                    <button type="submit" class="btn btn-success w-100">
                        {{'ACTUALIZAR CATEGORIA' if categoria else 'GUARDAR CATEGORIA'}}
                    </button>
                    <a href="{{ url_for('catalogo.admin_categorias') }}" class="btn btn-secondary w-100 mt-2">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
