{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-4 mb-5">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-body p-4">
                <!-- Título dinámico -->
                <h3 class="text-center mb-4">{{ 'Editar Producto' if producto else 'Nuevo Producto' }}</h3>
                
                <!-- El enctype es VITAL para subir imágenes -->
                <form method="POST" enctype="multipart/form-data">
                    <div class="row">
                        <!-- Este bloque solo aparece si estamos EDITANDO (si la variable 'producto' tiene datos) -->
                        {% if producto %}
                        <div class="col-md-4 mb-3">
                            <label>Código (Generado)</label>
                            <!-- readonly significa que se ve, pero no se puede editar -->
                            <input type="text" class="form-control" value="{{ producto.codigo }}" readonly style="background-color: #e9ecef;">
                        </div>
                        <div class="col-md-8 mb-3">
                            <label>Nombre del Producto</label>
                            <input type="text" name="nombre" class="form-control" value="{{ producto.nombre }}" required>
                        </div>
                        
                        <!-- Este bloque aparece si estamos CREANDO un producto nuevo -->
                        {% else %}
                        <div class="col-md-12 mb-3">
                            <label>Nombre del Producto</label>
                            <input type="text" name="nombre" class="form-control" required>
                        </div>
                        {% endif %}
                    </div>
                    
                    <div class="mb-3">
                        <label>Descripción</label>
                        <textarea name="descripcion" class="form-control" rows="2">{{ producto.descripcion if producto else '' }}</textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label>Categoría</label>
                            <select name="id_categoria" class="form-select" required>
                                <option value="">Seleccione...</option>
                                {% for c in categorias %}
                                    <!-- Marcamos la opción si estamos editando -->
                                    <option value="{{ c.id_categoria }}" {% if producto and producto.id_categoria == c.id_categoria %}selected{% endif %}>{{ c.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Marca</label>
                            <select name="id_marca" class="form-select" required>
                                <option value="">Seleccione...</option>
                                {% for m in marcas %}
                                    <!-- Marcamos la opción si estamos editando -->
                                    <option value="{{ m.id_marca }}" {% if producto and producto.id_marca == m.id_marca %}selected{% endif %}>{{ m.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label>Precio (Bs)</label>
                            <input type="number" step="0.01" name="precio" class="form-control" value="{{ producto.precio if producto else '' }}" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label>Stock (Cantidad)</label>
                            <input type="number" name="stock" class="form-control" value="{{ producto.stock if producto else '' }}" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label>Imagen (JPG/PNG)</label>
                            <input type="file" name="imagen" class="form-control" accept="image/*">
                            {% if producto and producto.imagen %}
                                <small class="text-muted">Dejar en blanco para conservar la actual.</small>
                            {% endif %}
                        </div>
                    </div>

                    <!-- Botones -->
                    <button type="submit" class="btn btn-success w-100 mt-3">
                        {{ 'ACTUALIZAR PRODUCTO' if producto else 'GUARDAR PRODUCTO' }}
                    </button>
                    <a href="{{ url_for('catalogo.admin_productos') }}" class="btn btn-secondary w-100 mt-2">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
